services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.2@sha256:879f4f10a98e3e167b32cde5f7ae3af0163d50bfacf567559a27a0e95a95670c
    container_name: forgejo
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__server__DOMAIN=git.orcachill.in
      - FORGEJO__server__ROOT_URL=https://git.orcachill.in
      - FORGEJO__server__HTTP_ADDR=0.0.0.0
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__SSH_DOMAIN=git.orcachill.in
      - FORGEJO__server__START_SSH_SERVER=true
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__server__SSH_LISTEN_PORT=2222
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__database__PATH=/data/forgejo.db
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__service__ENABLE_INTERNAL_SIGNIN=false
      - FORGEJO__service__ENABLE_BASIC_AUTHENTICATION=false
      - FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION=true
      - FORGEJO__actions__ENABLED=true
      - FORGEJO__packages__LIMIT_SIZE=-1
      - FORGEJO__oauth2__ENABLED=true
    ports:
      - "100.114.67.239:3000:3000"
      - "100.114.67.239:2222:2222"
    volumes:
      - /var/lib/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
