services:
  forgejo-runner:
    image: data.forgejo.org/forgejo/runner:13.2.1@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d
    container_name: forgejo-runner
    restart: always
    user: 0:0
    environment:
      - DOCKER_HOST=unix:///run/podman/podman.sock
    volumes:
      - /var/lib/forgejo-runner:/data
      - /etc/komodo/repos/infra-orkid/forgejo-runner/config/config.yml:/config.yml:ro
      - /run/podman/podman.sock:/run/podman/podman.sock
    command: forgejo-runner --config /config.yml daemon
    depends_on: []
