services:
  homeserver:
    image: forgejo.ellis.link/continuwuation/continuwuity:main-maxperf
    container_name: continuuwity-homeserver
    restart: unless-stopped
    ports:
      - "100.114.67.239:8448:6167"
    environment:
      CONTINUWUITY_SERVER_NAME: thighhighs.gay
      CONTINUWUITY_PORT: 6167
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_MAX_REQUEST_SIZE: 20000000
      CONTINUWUITY_CONFIG: /etc/continuwuity.toml
      CONTINUWUITY_ALLOW_CHECK_FOR_UPDATES: "true"
      CONTINUWUITY_ALLOW_FEDERATION: "true"
    volumes:
      - continuuwuity_db:/var/lib/continuwuity
      - ./continuwuity.toml:/etc/continuwuity.toml:ro

volumes:
  continuuwuity_db:
