services:
  grafana:
    image: docker.io/grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    container_name: grafana
    restart: always
    environment:
      GF_SERVER_ROOT_URL: https://grafana.orcachill.in/
    ports:
      - "100.114.67.239:3100:3000"
    volumes:
      - /var/lib/grafana/data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    image: docker.io/prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    container_name: prometheus
    restart: always
    ports:
      - "100.114.67.239:9090:9090"
    volumes:
      - /var/lib/prometheus/data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node_exporter
    command:
      - --path.rootfs=/host
      - --web.listen-address=100.114.67.239:9100
    network_mode: host
    pid: host
    restart: always
    volumes:
      - /:/host:ro,rslave
